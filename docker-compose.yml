# docker-compose.yml
version: '3'
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel_app
        restart: always  # Changed to always for production
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        networks:
            - laravel

    nginx:
        image: nginx:alpine
        container_name: laravel_nginx
        restart: always  # Changed to always for production
        ports:
            - "80:80"  # Changed to standard HTTP port
        volumes:
            - ./:/var/www
            - ./docker/nginx/conf.d:/etc/nginx/conf.d/
        networks:
            - laravel

    db:
        image: mysql:8.0
        container_name: laravel_db
        restart: always  # Changed to always for production
        environment:
            MYSQL_DATABASE: pet_shop_2
            MYSQL_ROOT_PASSWORD: ''
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        volumes:
            - dbdata:/var/lib/mysql/
        ports:
            - "3306:3306"  # For database access
        networks:
            - laravel

networks:
    laravel:
        driver: bridge

volumes:
    dbdata:
        driver: local
